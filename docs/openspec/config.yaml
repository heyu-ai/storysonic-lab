schema: spec-driven

context: |
  StorySonic Lab（故事聲音研究室）研究 Podcast 的故事風格與聲音表現。
  方向包括節目/RSS 蒐集、音檔下載、逐字稿與時間碼、故事結構與角色分析、
  語速/停頓/韻律/音效分析，以及 prompt 參考與訓練資料候選集整理。
  已提供 Python 3.11–3.13 下載、WAV 轉檔、MLX/CPU 逐字稿與 gws Drive 上傳 CLI；原生 Mac 與 Docker 部署入口見 docs/deployment。故事／語音分析尚未實作。
  研究與實驗放在 docs/research；重要架構取捨放在 docs/adr；
  規格與變更僅使用 docs/openspec，不另建 repo 根目錄 openspec。
  人類閱讀的內容使用繁體中文台灣用語；檔名、slug、識別符與機器解析語法保持英文。
  保留 Requirement/Scenario、SHALL/MUST、WHEN/THEN 等 OpenSpec 語法。
  研究資料需可追溯來源、查核日期、音訊版本與方法，並分開記錄事實、推論與未驗證假設。
  訓練資料候選集應記錄用途與授權狀態；公開可下載不代表已取得訓練或再發布授權。
  下載音檔與 manifest 放 Git 忽略的 content/；其他大型工作集與中間產物放 data/ 或 outputs/。

rules:
  proposal:
    - 說明研究或使用者問題、具體範圍、Non-goals，以及需要驗證的假設。
    - 引用相關 research 或 ADR；不要把未實作的能力寫成現有功能。
  specs:
    - 定義可觀察、可驗收的行為與失敗情境，保留 OpenSpec 規定的標頭與關鍵字。
    - 涉及資料取得或轉錄時，定義來源與版本追蹤、重複資料及不完整內容的處理方式。
  design:
    - 記錄方案取捨、來源證據、重現方式，以及仍待裁決的模型或儲存選型。
    - 若使用付費 API 或新增大規模處理，說明樣本量、計算方式與可控的成本範圍。
  tasks:
    - 每項任務有明確結果與適合變更範圍的驗證；區分研究實驗和正式功能實作。
    - 未執行或未通過驗證的任務不可標記完成。
